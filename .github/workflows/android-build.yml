name: Build Android APK

# The sandbox this app is normally developed in has no internet access to
# download the Android SDK, so the APK can only ever be built here, on a
# GitHub-hosted runner with unrestricted internet.
on:
  push:
    branches:
      - claude/pharmacy-app-development-6qax56
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - run: flutter pub get

      # A universal (all-ABI) release APK came out at ~109MB, over
      # GitHub's 100MB per-file git push limit (see the
      # android-apk-latest branch step below) - arm64-v8a alone covers
      # virtually every Android phone sold in the last several years and
      # comes out much smaller.
      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: saydaliti-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Actions-artifact downloads redirect to Azure Blob Storage, which
      # the sandbox this app is normally developed in has no route to
      # (only plain github.com git/API traffic is reachable there) - an
      # orphan branch holding just the latest APK is fetchable the same
      # way every other push/pull in this project already works.
      - name: Publish APK to the android-apk-latest branch
        run: |
          cd "$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk" ./saydaliti.apk
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b android-apk-latest
          git add saydaliti.apk
          git commit -q -m "Latest Android APK build (run ${{ github.run_id }})"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin android-apk-latest
