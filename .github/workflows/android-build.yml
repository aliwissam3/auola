name: Build Android APK

# The sandbox this app is normally developed in has no internet access to
# download the Android SDK, so the APK can only ever be built here, on a
# GitHub-hosted runner with unrestricted internet.
on:
  push:
    branches:
      - claude/pharmacy-app-development-6qax56
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: saydaliti-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
